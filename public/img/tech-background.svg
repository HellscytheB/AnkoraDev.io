<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes -->
    <radialGradient id="mainGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a222c;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a0d;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2fff8c;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#1ed16f;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#2fff8c;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Filtros -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="100%" height="100%" fill="url(#mainGradient)"/>
  
  <!-- Círculos de fondo con efecto tech -->
  <circle cx="300" cy="200" r="150" fill="none" stroke="#2fff8c" stroke-width="1" opacity="0.1"/>
  <circle cx="300" cy="200" r="120" fill="none" stroke="#2fff8c" stroke-width="0.5" opacity="0.15"/>
  <circle cx="300" cy="200" r="90" fill="none" stroke="#2fff8c" stroke-width="0.3" opacity="0.2"/>
  
  <circle cx="1600" cy="300" r="200" fill="none" stroke="#1ed16f" stroke-width="1" opacity="0.08"/>
  <circle cx="1600" cy="300" r="160" fill="none" stroke="#1ed16f" stroke-width="0.5" opacity="0.12"/>
  
  <circle cx="800" cy="800" r="100" fill="none" stroke="#2fff8c" stroke-width="0.8" opacity="0.1"/>
  <circle cx="800" cy="800" r="70" fill="none" stroke="#2fff8c" stroke-width="0.4" opacity="0.15"/>
  
  <circle cx="1400" cy="900" r="180" fill="none" stroke="#1ed16f" stroke-width="1" opacity="0.06"/>
  <circle cx="1400" cy="900" r="140" fill="none" stroke="#1ed16f" stroke-width="0.6" opacity="0.1"/>
  
  <!-- Líneas tecnológicas -->
  <path d="M100,100 L400,120 L600,80 L900,110" stroke="#2fff8c" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M1200,200 L1500,180 L1700,220 L1800,200" stroke="#1ed16f" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M200,600 L500,580 L800,620 L1100,590" stroke="#2fff8c" stroke-width="0.4" fill="none" opacity="0.2"/>
  <path d="M1000,700 L1300,720 L1600,680 L1900,710" stroke="#1ed16f" stroke-width="0.4" fill="none" opacity="0.18"/>
  
  <!-- Grid pattern sutil -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#2fff8c" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Puntos de luz -->
  <circle cx="450" cy="400" r="2" fill="#2fff8c" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1200" cy="500" r="1.5" fill="#1ed16f" opacity="0.7" filter="url(#glow)"/>
  <circle cx="750" cy="250" r="1" fill="#2fff8c" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1500" cy="700" r="2.5" fill="#1ed16f" opacity="0.5" filter="url(#glow)"/>
  <circle cx="200" cy="800" r="1.5" fill="#2fff8c" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1100" cy="150" r="1" fill="#1ed16f" opacity="0.7" filter="url(#glow)"/>
  
  <!-- Formas geométricas abstractas -->
  <polygon points="1300,400 1350,450 1300,500 1250,450" fill="none" stroke="#2fff8c" stroke-width="0.8" opacity="0.15"/>
  <polygon points="500,700 570,720 540,790 470,770" fill="none" stroke="#1ed16f" stroke-width="0.6" opacity="0.12"/>
  
  <!-- Efecto de brillo superior -->
  <ellipse cx="960" cy="0" rx="800" ry="200" fill="url(#glowGradient)" opacity="0.3"/>
  
  <!-- Partículas adicionales */
  <rect x="300" y="600" width="1" height="1" fill="#2fff8c" opacity="0.4"/>
  <rect x="850" y="450" width="1" height="1" fill="#1ed16f" opacity="0.5"/>
  <rect x="1400" y="600" width="1" height="1" fill="#2fff8c" opacity="0.3"/>
  <rect x="600" y="350" width="1" height="1" fill="#1ed16f" opacity="0.6"/>
  <rect x="1100" y="800" width="1" height="1" fill="#2fff8c" opacity="0.4"/>
</svg>
